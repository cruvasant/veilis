[package]
name = "veilis"
version = "0.1.0"
edition = "2024"
license = "MIT"

[build-dependencies]
# Önyükleyici: BIOS ve UEFI disk imajlarını üretir.
bootloader = "0.11"
# Çekirdek, build.rs için bir yapı (artifact) bağımlılığı olarak çıplak donanım hedefine derlenir.
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[profile.dev]
# Hata ayıklama derlemesinde arayüz çizimi çok yavaş kalıyor.
opt-level = 1
